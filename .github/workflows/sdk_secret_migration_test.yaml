name: SDK secret migration tests

on:
  pull_request:
    paths:
      - .github/scripts/migrate_sdk_secrets.py
      - .github/scripts/test_migrate_sdk_secrets.py
      - .github/workflows/sdk_secret_migration.yaml
      - .github/workflows/sdk_secret_migration_test.yaml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Test migration with synthetic credentials and a fake GitHub API
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_migrate_sdk_secrets.py' -v
