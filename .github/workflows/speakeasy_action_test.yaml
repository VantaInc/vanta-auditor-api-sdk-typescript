name: Speakeasy Action Tests
on:
  pull_request:
    paths:
      - .github/actions/prepare-speakeasy/**
      - .github/workflows/sdk_generation.yaml
      - .github/workflows/sdk_publish.yaml
      - .github/workflows/speakeasy_generate.yaml
      - .github/workflows/speakeasy_publish.yaml
      - .github/workflows/speakeasy_action_test.yaml
      - .speakeasy/workflow.yaml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .speakeasy/temp/action
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/prepare-speakeasy
      - name: Test preparation failure cleanup
        run: bash "$GITHUB_WORKSPACE/.github/actions/prepare-speakeasy/test.sh"
      - name: Test pin updates and installer verification
        run: python3 -B -m unittest discover -s "$GITHUB_WORKSPACE/.github/actions/prepare-speakeasy" -p 'test_*.py'
      - name: Verify pinned release artifact
        run: python3 -B "$GITHUB_WORKSPACE/.github/actions/prepare-speakeasy/update_cli.py" --check
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: .speakeasy/temp/action/go.mod
          cache-dependency-path: .speakeasy/temp/action/go.sum
      - name: Test CLI integrity and early failure
        run: go test . ./internal/cli ./internal/configuration
