name: Speakeasy Generate
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      force:
        type: string
        default: "false"
      set_version:
        type: string
    secrets:
      github_access_token:
        required: true
      SPEAKEASY_API_KEY:
        required: true
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    environment: sdk-automation
    runs-on: ubuntu-22.04
    steps:
      - name: Verify environment credentials
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: |
          for name in SPEAKEASY_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required environment secret ${name} is missing. Configure it under Settings > Environments."
              exit 1
            fi
          done
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.github_access_token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate reviewed spec before generation
        run: |
          npm ci --prefix .github/scripts/sdk-spec --ignore-scripts --no-audit --no-fund
          node .github/scripts/sdk-spec/spec.mjs validate openapi
      - id: prepare
        uses: ./.github/actions/prepare-speakeasy
      - id: run-workflow
        name: Run Generation Workflow
        uses: ./.speakeasy/temp/action
        with:
          github_access_token: ${{ secrets.github_access_token }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
          mode: ${{ inputs.mode }}
          force: ${{ inputs.force }}
          set_version: ${{ inputs.set_version }}
          poetry_version: "2.2.1"
          enable_sdk_changelog: "true"
      - name: Log Generation Output
        uses: ./.speakeasy/temp/action
        with:
          action: log-result
          github_access_token: ${{ secrets.github_access_token }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
        env:
          GH_ACTION_RESULT: ${{ job.status }}
          RESOLVED_SPEAKEASY_VERSION: ${{ steps.run-workflow.outputs.resolved_speakeasy_version }}
          GH_ACTION_VERSION: ${{ github.sha }}
          GH_ACTION_STEP: ${{ github.job }}
