name: Sync auditor spec
on:
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sdk-spec-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    environment: sdk-spec-sync
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          path: sdk
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk
      - id: obsidian
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OBSIDIAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.OBSIDIAN_APP_PRIVATE_KEY }}
          owner: VantaInc
          repositories: obsidian
          permission-contents: read
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        id: source
        with:
          repository: VantaInc/obsidian
          ref: main
          token: ${{ steps.obsidian.outputs.token }}
          path: obsidian
          sparse-checkout: apps/api-external/assets/__generated__/auditor-api/v1/api-spec.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Copy the self-contained spec
        run: |
          source_spec=obsidian/apps/api-external/assets/__generated__/auditor-api/v1/api-spec.yaml
          node sdk/.github/scripts/validate-spec.mjs "$source_spec"
          cp "$source_spec" sdk/openapi/auditor-api.yaml
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          path: sdk
          branch: automation/obsidian-auditor-spec
          base: main
          add-paths: openapi/auditor-api.yaml
          sign-commits: true
          commit-message: 'chore: sync auditor API spec from Obsidian'
          title: 'chore: update auditor API spec from Obsidian'
          body: |
            Updates the auditor spec from [Obsidian commit ${{ steps.source.outputs.commit }}](https://github.com/VantaInc/obsidian/commit/${{ steps.source.outputs.commit }}).

            Review the YAML diff and confirm it describes the released public API before merging.
            Merging triggers a separate SDK generation PR; publishing retains its approval gate.
            This branch is managed by automation. Make source corrections in Obsidian.
