name: Generate
permissions:
  contents: write
  pull-requests: write
  id-token: write
"on":
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: optionally set a specific SDK version
        type: string
  schedule:
    - cron: 0 0 * * *
jobs:
  spec:
    if: github.ref == 'refs/heads/main'
    environment: sdk-spec-fetch
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - id: obsidian
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OBSIDIAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.OBSIDIAN_APP_PRIVATE_KEY }}
          owner: VantaInc
          repositories: obsidian
          permission-contents: read
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        id: source
        with:
          repository: VantaInc/obsidian
          ref: main
          token: ${{ steps.obsidian.outputs.token }}
          path: obsidian
          sparse-checkout: apps/api-external/assets/__generated__/auditor-api/v1/api-spec.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Record the Obsidian source commit
        env:
          OBSIDIAN_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          source_spec=obsidian/apps/api-external/assets/__generated__/auditor-api/v1/api-spec.yaml
          test -s "$source_spec" && test ! -L "$source_spec"
          echo "Auditor spec source: VantaInc/obsidian@$OBSIDIAN_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auditor-spec-${{ steps.source.outputs.commit }}
          path: obsidian/apps/api-external/assets/__generated__/auditor-api/v1/api-spec.yaml
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  generate:
    if: github.ref == 'refs/heads/main'
    needs: spec
    uses: ./.github/workflows/speakeasy_generate.yaml
    with:
      obsidian_commit: ${{ needs.spec.outputs.commit }}
      force: ${{ github.event.inputs.force }}
      mode: pr
      set_version: ${{ github.event.inputs.set_version }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
