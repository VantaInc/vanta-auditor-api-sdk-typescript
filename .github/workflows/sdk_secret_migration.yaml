name: Migrate SDK secrets once

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate setup first; copy only after a successful validation
        type: choice
        options:
          - validate
          - copy
        default: validate
        required: true

permissions:
  contents: read

concurrency:
  group: sdk-secret-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'VantaInc/vanta-auditor-api-sdk-typescript' && github.ref == 'refs/heads/main'
    environment: sdk-secret-migration
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate or copy the fixed SDK secret set
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_GITHUB_TOKEN }}
          SOURCE_SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          SOURCE_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          MIGRATION_MODE: ${{ inputs.mode }}
        run: python3 -B .github/scripts/migrate_sdk_secrets.py
