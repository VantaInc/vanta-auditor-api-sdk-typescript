name: Publish
permissions:
  contents: write
  id-token: write
"on":
  push:
    branches:
      - main
    paths:
      - .speakeasy/gen.lock
  workflow_dispatch: {}
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/speakeasy_publish.yaml
    with:
      target: vanta
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
