    VendorContractAmount:
      properties:
        amount:
          type: number
          format: double
          description: The amount of the contract.
        currency:
          $ref: "#/components/schemas/CurrencyCode"
          description: The currency of the contract.
      required:
        - amount
        - currency
      type: object
      additionalProperties: false
    CustomField:
      properties:
        label:
          type: string
        value:
          anyOf:
            - type: string
            - items:
                type: string
              type: array
      required:
        - label
        - value
      type: object
      additionalProperties: false
    VendorDecisionStatus:
      enum:
        - APPROVED
        - CONDITIONALLY_APPROVED
        - NOT_APPROVED
      type: string
    VendorDecision:
      description: The decision for a vendor.
      properties:
        status:
          $ref: "#/components/schemas/VendorDecisionStatus"
        lastUpdatedAt:
          type: string
          format: date-time
      required:
        - status
        - lastUpdatedAt
      type: object
      additionalProperties: false
    VendorRelationshipSummary:
      properties:
        id:
          type: string
          description: The vendor's unique ID.
        name:
          type: string
          description: The vendor's display name.
        status:
          $ref: "#/components/schemas/VendorStatus"
          description: The vendor's current status.
        websiteUrl:
          type: string
          nullable: true
          description: The vendor's website URL, or null when none is set.
      required:
        - id
        - name
        - status
        - websiteUrl
      type: object
      additionalProperties: false
    Vendor:
      properties:
        id:
          type: string
          description: The vendor's unique ID.
        name:
          type: string
          description: The vendor's display name.
        websiteUrl:
          type: string
          nullable: true
          description: The vendor's website URL.
        accountManagerName:
          type: string
          nullable: true
          description: The vendor's external account manager name.
        accountManagerEmail:
          type: string
          nullable: true
          description: The vendor's external account manager email.
        servicesProvided:
          type: string
          nullable: true
          description: Services provided by the vendor.
        additionalNotes:
          type: string
          nullable: true
          description: Any additional notes about the vendor
        securityOwnerUserId:
          type: string
          nullable: true
          description: The vendor's security owner's Vanta user ID.
        businessOwnerUserId:
          type: string
          nullable: true
          description: The vendor's business owner's Vanta user ID.
        contractStartDate:
          type: string
          format: date-time
          nullable: true
          description: The date the contract with the vendor began.
        contractRenewalDate:
          type: string
          format: date-time
          nullable: true
          description: The date the contract with the vendor is up for renewal.
        contractTerminationDate:
          type: string
          format: date-time
          nullable: true
          description: The date the contract with the vendor was terminated.
        nextSecurityReviewDueDate:
          type: string
          format: date-time
          nullable: true
          description: The next due date for a security review.
        lastSecurityReviewCompletionDate:
          type: string
          format: date-time
          nullable: true
          description: The most recent date a security review was completed.
        isVisibleToAuditors:
          type: boolean
          nullable: true
          description: Whether or not auditors can view this vendor.
        isRiskAutoScored:
          type: boolean
          nullable: true
          description: Whether or not the vendor's risk is automatically scored.
        riskAttributeIds:
          items:
            type: string
          type: array
          description: The list of risk attribute IDs the vendor has been assigned to.
        categoryId:
          type: string
          nullable: true
          description: The ID of the vendor's category.
        category:
          properties:
            displayName:
              type: string
          required:
            - displayName
          type: object
          nullable: true
          description: The vendor's category.
          deprecated: true
        authDetails:
          properties:
            passwordMinimumLength:
              type: number
              format: double
              nullable: true
              description: Minimum number for chacters required for passwords for this vendor.
            passwordRequiresSymbol:
              type: boolean
              nullable: true
              description: Whether or not the vendor requires passwords to have a symbol.
            passwordRequiresNumber:
              type: boolean
              nullable: true
              description: Whether or not the vendor requires passwords to have a number.
            passwordMFA:
              type: boolean
              nullable: true
              description:
                Whether or not the vendor requires passwords to have multi factor
                authentication.
            method:
              allOf:
                - $ref: "#/components/schemas/VendorAuthenticationMethod"
              nullable: true
              description: The vendor's authentication method.
          required:
            - passwordMinimumLength
            - passwordRequiresSymbol
            - passwordRequiresNumber
            - passwordMFA
            - method
          type: object
          description: The vendor's authentication details.
        status:
          $ref: "#/components/schemas/VendorStatus"
          description: The vendor's current status.
        inherentRiskLevel:
          $ref: "#/components/schemas/VendorRiskLevel"
          description: The vendor's risk level.
        residualRiskLevel:
          $ref: "#/components/schemas/VendorRiskLevel"
          description: The vendor's residual risk level.
        vendorHeadquarters:
          allOf:
            - $ref: "#/components/schemas/CountryCode"
          nullable: true
          description: The vendor's headquarters.
        contractAmount:
          allOf:
            - $ref: "#/components/schemas/VendorContractAmount"
          nullable: true
          description: The contract amount for the vendor.
        customFields:
          items:
            $ref: "#/components/schemas/CustomField"
          type: array
          nullable: true
          description: The vendor's custom fields.
        latestDecision:
          allOf:
            - $ref: "#/components/schemas/VendorDecision"
          nullable: true
          description:
            The vendor's latest decision status. Null means no decision has
            been made.
        linkedTaskTrackerTaskProcurementRequest:
          properties:
            url:
              type: string
            service:
              type: string
          required:
            - url
            - service
          type: object
          nullable: true
          description:
            The task tracker procurement request associated with this vendor
            (if linked).
        engagements:
          items:
            $ref: "#/components/schemas/VendorRelationshipSummary"
          type: array
          description: >-
            A product, service, or subsidiary you use from a vendor. Each
            engagement

            belongs to one parent vendor, has its own risk score and
            assessments, and

            cannot have engagements of its own. Returned engagements are sorted
            by name.

            Empty when there are none.
          maxItems: 100
        parentVendor:
          allOf:
            - $ref: "#/components/schemas/VendorRelationshipSummary"
          nullable: true
          description:
            The parent vendor of this engagement, or null when there is no
            accessible parent.
      required:
        - id
        - name
        - websiteUrl
        - accountManagerName
        - accountManagerEmail
        - servicesProvided
        - additionalNotes
        - securityOwnerUserId
        - businessOwnerUserId
        - contractStartDate
        - contractRenewalDate
        - contractTerminationDate
        - nextSecurityReviewDueDate
        - lastSecurityReviewCompletionDate
        - isVisibleToAuditors
        - isRiskAutoScored
        - riskAttributeIds
        - categoryId
        - category
        - authDetails
        - status
        - inherentRiskLevel
        - residualRiskLevel
        - vendorHeadquarters
        - contractAmount
        - customFields
        - latestDecision
        - linkedTaskTrackerTaskProcurementRequest
      type: object
      additionalProperties: false
    PaginatedResponse_Vendor_:
      properties:
        results:
          properties:
            data:
              items:
                $ref: "#/components/schemas/Vendor"
              type: array
            pageInfo:
              $ref: "#/components/schemas/PageInfo"
          required:
            - data
            - pageInfo
          type: object
      required:
        - results
      type: object
      additionalProperties: false
    PageSize:
      type: integer
      format: int32
      default: 10
      description:
        Controls the maximum number of items returned in one response from
        the API.
      minimum: 1
      maximum: 100
    ComputerStatusOutcome:
      description: >-
        The possible outcomes of a status check. The outcome can be one of the
        following:

        FAIL:  The check is failing.

        IN_PROGRESS: The check needs further data from the given computer in
        order to evaluate. The field(s) needed from a computer to calculate the
        ComputerStatusOutcome were null.

        NA: The check is not applicable for the given computer.

        PASS: The check is passing.
      enum:
        - FAIL
        - IN_PROGRESS
        - NA
        - PASS
      type: string
    ComputerStatus:
      description:
        The a status check for a computer. Representation for screenlock,
        diskEncryption, passwordManager, and antivirusInstallation.
      properties:
        outcome:
          $ref: "#/components/schemas/ComputerStatusOutcome"
          description: The outcome of the status check.
      required:
        - outcome
      type: object
      additionalProperties: false
    OperatingSystemType:
      description: The possible types of the operating system. One of `mac_OS`,
        `linux`, or `windows`.
      enum:
        - macOS
        - linux
        - windows
