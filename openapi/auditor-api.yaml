        !== null`).

        Clients should check the `deletionDate` field to identify and handle
        deleted records

        appropriately in their systems.


        This is the only endpoint that returns a deleted information request. No

        webhook fires when a request is deleted. Endpoints under

        `/audits/{auditId}/information-requests/{requestId}` return a 4xx HTTP
        error

        for a deleted request. To confirm deletion, check the request's
        `deletionDate`

        in this list. Deleting a request does not set `deletionDate` on its
        comments

        or evidence or send delete events for them. Once this list confirms the

        request was deleted, treat its comments and evidence as deleted too.


        This endpoint supports delta synchronization via the `changedSinceDate`
        parameter,

        allowing efficient polling for changes without retrieving the entire
        dataset.


        Pagination usage:

        1. Make initial request with desired `pageSize`

        2. Check `results.pageInfo.hasNextPage` to see if more data exists

        3. If true, use `results.pageInfo.endCursor` as `pageCursor` in next
        request

        4. Repeat until `hasNextPage` is false


        Delta sync usage:

        1. Store the timestamp of your last sync

        2. Pass that timestamp as `changedSinceDate`

        3. Only requests created, modified, or deleted since that timestamp are
        returned

        4. Process updates and soft-deletes by checking the `deletionDate` field

        5. Update your last sync timestamp to the current time


        `segmentIds` on each returned request is resolved against the audit's

        current scope. A scope-only change (a segment leaving or joining the
        audit

        without the request row being written) is not a delta-sync event.
        Re-fetch

        without `changedSinceDate`, or GET by id, to see the current projection.


        Rate limit: 50 requests / minute.
      summary: List information requests for an audit
      tags:
        - Audits
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auditId
          required: true
          schema:
            type: string
        - description: Maximum number of information requests to return per page.
          in: query
          name: pageSize
          required: false
          schema:
            $ref: "#/components/schemas/PageSize"
        - description:
            Pagination cursor from a previous response. Provide to fetch the
            next page of results.
          in: query
          name: pageCursor
          required: false
          schema:
            $ref: "#/components/schemas/PageCursor"
        - description: >-
            Includes all information requests that have changed since
            changedSinceDate.

            Considers creationDate, modificationDate, and deletionDate
            timestamps when determining changes.

            Does not include requests whose only change is the derived
            `segmentIds`

            projection after an audit-scope change.
          in: query
          name: changedSinceDate
          required: false
          schema:
            format: date-time
            type: string
        - description: >-
            Return requests whose stored segment assignment includes any of
            these

            IDs (OR). Omit to return all. A match can still come back with

            `segmentIds: []` if the stored ID is no longer in the audit's scope.
          in: query
          name: segmentIdsMatchesAny
          required: false
          schema:
            type: array
            items:
              type: string
