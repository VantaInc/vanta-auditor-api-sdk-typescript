    AuditControlAssessmentState:
      type: string
      enum:
        - IN_PLACE
        - NOT_IN_PLACE
        - PARTIAL
        - NOT_ASSESSED
        - CONFORMING
        - MINOR_NON_CONFORMITY
        - MAJOR_NON_CONFORMITY
        - SATISFIED
        - NOT_SATISFIED
        - OTHER_THAN_SATISFIED
        - "TRUE"
        - "FALSE"
      description: >-
        An auditor's assessment of a control within an audit. This is the full
        flat

        union of every framework's assessment states (the superset); the
        selected

        segment's framework determines which subset applies. `NOT_ASSESSED` is
        shared

        by all frameworks and is the default for a control that has not yet been
        assessed.


        Which states apply to which framework:

        - Most frameworks (e.g. SOC 2): `IN_PLACE`, `NOT_IN_PLACE`, `PARTIAL`,
        `NOT_ASSESSED`

        - ISO 27001: `CONFORMING`, `MINOR_NON_CONFORMITY`,
        `MAJOR_NON_CONFORMITY`, `NOT_ASSESSED`

        - FedRAMP: `SATISFIED`, `NOT_SATISFIED`, `OTHER_THAN_SATISFIED`,
        `NOT_ASSESSED`

        - FedRAMP Key Security Indicators (KSI): `TRUE`, `FALSE`, `PARTIAL`,
        `NOT_ASSESSED`


        Distinct from `ControlStatus`, which is the computed
        tests/documents-passing

        status — a different concept.
    AuditControlAssessment:
      description: >-
        An auditor's assessment of a control within one audit segment.
        Assessments

        can be recorded for any segment on the audit, `PROGRAM` or `SYSTEM`, and
        a

        control can carry a distinct assessment per segment.

        A segment with no recorded assessment returns `NOT_ASSESSED` with a
        `null`

        justification.
      properties:
        segmentId:
          type: string
          description: The audit segment this assessment belongs to.
        assessmentState:
          $ref: "#/components/schemas/AuditControlAssessmentState"
          description: >-
            The auditor's assessment of the control for this segment;
            `NOT_ASSESSED`

            when no assessment has been recorded.
        justification:
          type: string
          nullable: true
          description:
            Free-text reasoning for the assessment; `null` when none has been
            recorded.
      required:
        - segmentId
        - assessmentState
        - justification
      type: object
      additionalProperties: false
    ControlSource:
      enum:
