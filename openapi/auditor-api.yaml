                        hasPreviousPage: false
                        startCursor: Njg5MGU0NzNkY2UxZGE1Z
                        endCursor: Njg5MGU0NzNkY2UxZGE1Z
      description: >-
        Returns a paginated list of active information requests linked to a
        specific

        control within an IRL audit. Only links saved on the audit's current

        control rows are included.


        Soft-deleted information requests are not included in the response. To

        synchronize deletions, use `GET /audits/{auditId}/information-requests`,

        which supports `changedSinceDate` and includes soft-deleted records.


        Returns 404 when the control is not part of the audit. Returns an empty
        page

        when the control is part of the audit but has no active IRLs linked to
        it.


        Pagination usage:

        1. Make initial request with desired `pageSize`

        2. Check `results.pageInfo.hasNextPage` to see if more data exists

        3. If true, use `results.pageInfo.endCursor` as `pageCursor` in next
        request

        4. Repeat until `hasNextPage` is false


        Rate limit: 50 requests / minute.
      summary: List information requests linked to a control within an audit
      tags:
        - Audits
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auditId
          required: true
          schema:
            type: string
        - in: path
          name: controlId
          required: true
          schema:
            type: string
        - description: Maximum number of information requests to return per page.
          in: query
          name: pageSize
          required: false
          schema:
            $ref: "#/components/schemas/PageSize"
        - description:
            Pagination cursor from a previous response. Provide to fetch the
            next page of results.
          in: query
          name: pageCursor
          required: false
          schema:
            $ref: "#/components/schemas/PageCursor"
  /audits/{auditId}/controls/{controlId}/comments:
    get:
      operationId: ListCommentsForControl
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse_AuditControlComment_"
              examples:
                Example 1:
                  value:
                    results:
                      data:
                        - id: 65fc81a3359c8508c9af880f
                          text: Some comment
                          creationDate: 2024-03-07T21:25:56.000Z
                          modificationDate: 2024-03-07T21:25:56.000Z
                          deletionDate: 2024-03-07T21:25:56.000Z
                          email: vlad@vantaroo.com
                          authorName: Vlad Vantaroo
                      pageInfo:
                        hasNextPage: false
                        hasPreviousPage: false
                        startCursor: Njg5MGU0NzNkY2UxZGE1Z
                        endCursor: Njg5MGU0NzNkY2UxZGE1Z
      description: >-
        Retrieves a paginated list of comments on a control within an IRL audit,

        enabling auditors to view collaboration history on the control.


        This endpoint always includes soft-deleted records (where `deletionDate
        !== null`).

        Clients should check the `deletionDate` field to identify and handle
        deleted records

        appropriately in their systems.


        This endpoint supports delta synchronization via the `changedSinceDate`
        parameter,

        allowing efficient polling for changes without retrieving the entire
        dataset.


        Returns 404 when the control is not part of the audit.


        Pagination usage:

        1. Make initial request with desired `pageSize`

        2. Check `results.pageInfo.hasNextPage` to see if more data exists

        3. If true, use `results.pageInfo.endCursor` as `pageCursor` in next
        request

        4. Repeat until `hasNextPage` is false


        Delta sync usage:

        1. Store the timestamp of your last sync

        2. Pass that timestamp as `changedSinceDate`

        3. Only comments created, modified, or deleted since that timestamp are
        returned

        4. Process updates, including soft-deletes (deletionDate !== null)

        5. Update your last sync timestamp to the current time


        Rate limit: 50 requests / minute.
      summary: List comments for a control within an audit
      tags:
        - Audits
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auditId
          required: true
          schema:
            type: string
        - in: path
          name: controlId
          required: true
          schema:
            type: string
        - description: Maximum number of comments to return per page.
          in: query
          name: pageSize
          required: false
          schema:
            $ref: "#/components/schemas/PageSize"
        - description:
            Pagination cursor from a previous response. Provide to fetch the
            next page of comments.
          in: query
          name: pageCursor
          required: false
          schema:
            $ref: "#/components/schemas/PageCursor"
        - description: >-
            Includes all comments that have changed since changedSinceDate.

            Considers creationDate, modificationDate, and deletionDate
            timestamps when determining changes.
          in: query
          name: changedSinceDate
          required: false
          schema:
            format: date-time
            type: string
    post:
      operationId: CreateCommentForControl
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditControlComment"
              examples:
                Example 1:
                  value:
                    id: 65fc81a3359c8508c9af880f
                    text: Some comment
                    creationDate: 2024-03-07T21:25:56.000Z
                    modificationDate: 2024-03-07T21:25:56.000Z
                    deletionDate: 2024-03-07T21:25:56.000Z
                    email: vlad@vantaroo.com
                    authorName: Vlad Vantaroo
      description: >-
        Creates a new comment on a control within an IRL audit. The comment
        author

        must be an auditor in the audit firm making the request. The comment
        will be

        associated with the control and visible to all authorized users.


        Returns 404 when the control is not part of the audit.


        Rate limit: 50 requests / minute.
      summary: Create a comment for a control within an audit
      tags:
        - Audits
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auditId
          required: true
          schema:
            type: string
        - in: path
          name: controlId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAuditControlCommentInput"
  /audits/{auditId}/controls/{controlId}/comments/{commentId}:
    patch:
      operationId: UpdateCommentForControl
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditControlComment"
              examples:
                Example 1:
                  value:
                    id: 65fc81a3359c8508c9af880f
                    text: Some comment
                    creationDate: 2024-03-07T21:25:56.000Z
                    modificationDate: 2024-03-07T21:25:56.000Z
                    deletionDate: 2024-03-07T21:25:56.000Z
                    email: vlad@vantaroo.com
                    authorName: Vlad Vantaroo
      description: >-
        Updates an existing comment on a control. Only the original author

        of the comment can update it. The author is identified by their email
        address,

        which must match the email of the user who created the comment.


        Rate limit: 10 requests / minute.
      summary: Update a comment for a control within an audit
      tags:
        - Audits
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auditId
          required: true
          schema:
            type: string
        - in: path
          name: controlId
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuditControlCommentInput"
    delete:
      operationId: DeleteCommentForControl
      responses:
        "204":
          description: No content
      description: >-
        Deletes an existing comment on a control. Only the original author

        of the comment can delete it. The author is identified by their email
        address,

        which must match the email of the user who created the comment.


        Rate limit: 10 requests / minute.
      summary: Delete a comment for a control within an audit
      tags:
        - Audits
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auditId
          required: true
          schema:
            type: string
        - in: path
          name: controlId
          required: true
          schema:
            type: string
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAuditControlCommentInput"
  /audits/{auditId}/controls/{controlId}/assessment:
    put:
      operationId: UpsertAssessmentForControl
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditorControlAssessment"
              examples:
                Example 1:
                  value:
                    controlId: a2f7e1b9d0c3f4e5a6c7b8d9
                    segmentId: 65fc81a3359c8508c9af880f
                    assessmentState: IN_PLACE
                    justification:
                      Encryption at rest and in transit verified via cloud
                      configuration evidence.
      description: >-
        Records (upserts) an auditor's assessment state and justification for a

        control within an IRL audit — the API equivalent of assessing a control
        in

        the web app. Overwrites the assessment for this control in the chosen

        audit segment.


        `segmentId` may be any segment on the audit, `PROGRAM` or `SYSTEM` (see

        `segments` on the audit). It may be omitted only when the audit has

        exactly one segment. The `assessmentState` must be valid for that

        segment's framework (the request is rejected otherwise). The acting

        auditor is identified by `auditorEmail`, which must belong to the audit

        firm making the request.


        Returns 404 when the control is not part of the audit or the auditor
        email

        does not resolve to a firm user. Returns 422 when `segmentId` is omitted

        on an audit with more than one segment, when `segmentId` is not a
        segment

        on this audit, or when the control is not assigned to that segment for

        this audit. Applies to both Full and Controlled Audit View audits.


        Rate limit: 10 requests / minute.
      summary: Upsert a control's assessment within an audit
      tags:
        - Audits
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: auditId
          required: true
          schema:
            type: string
        - in: path
          name: controlId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAuditControlAssessmentInput"
  /audits/{auditId}/assets/code-changes:
    get:
      operationId: ListCodeChanges
      responses:
        "200":
          description: Paginated list of code changes with pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse_CodeChange_"
              examples:
                Example 1:
                  value:
                    results:
                      pageInfo:
                        hasNextPage: true
                        hasPreviousPage: false
                        startCursor: code_change_12345
                        endCursor: code_change_12345
                      data:
                        - id: code_change_12345
                          codeChange: fix-auth-bug
                          segmentIds:
                            - 5f2c939a52855e725c8d5825
                          identifier: "101"
                          service: github
                          repository: vanta/obsidian
                          openedAt: 2025-01-25T14:30:00.000Z
                          closedAt: 2025-03-25T14:30:00.000Z
      description: >-
        Retrieves code changes population data for an audit.


        This endpoint provides access to code change records (pull requests)

        visible to auditors during an audit engagement.


        Supports filtering by:

        - `search`: Searches code change titles and repository names
        (case-insensitive)

        - `sourcesMatchesAny`: Filters by version control source (accepted
        values: github, gitlab, bitbucket, azuredevops)

        - `closedAfterDate` / `closedBeforeDate`: Filters by the closed date
        range


        Uses cursor-based pagination. To paginate:

        1. Make initial request with desired `pageSize`

        2. Check `results.pageInfo.hasNextPage`

        3. Use `results.pageInfo.endCursor` as `pageCursor` for next request


        Results are sorted by closed date (newest first). This sort order is

        fixed and cannot be customized via query parameters.


        On an audit that covers more than one framework, each code change in

        scope for any of the audit's frameworks is returned once.


        Audits with system segments are not supported by this endpoint.


        Only Controlled Audit View (CAV) audits are supported. Full Audit View

        audits are rejected with 403. Returns 403 if the customer has not made

        this population page visible to auditors.


        Rate limit: 10 requests / minute.
      summary: List code changes for an audit
      tags:
        - Audits
      security:
        - bearerAuth: []
      parameters:
        - description: The audit ID
          in: path
          name: auditId
          required: true
          schema:
            type: string
        - description: Maximum number of results per page (1-100, default 10)
          in: query
          name: pageSize
          required: false
          schema:
            $ref: "#/components/schemas/PageSize"
        - description: Pagination cursor from previous response
          in: query
          name: pageCursor
          required: false
          schema:
            $ref: "#/components/schemas/PageCursor"
        - description: Search term for filtering by code change title or repository name
          in: query
          name: search
          required: false
          schema:
            type: string
        - description:
            "Filter code changes by version control source (accepted values:
            github, gitlab, bitbucket, azuredevops)"
          in: query
          name: sourcesMatchesAny
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ApiCodeChangeSource"
        - description: Filter code changes closed on or after this date (ISO 8601)
          in: query
          name: closedAfterDate
          required: false
          schema:
            format: date-time
            type: string
        - description: Filter code changes closed on or before this date (ISO 8601)
          in: query
          name: closedBeforeDate
          required: false
          schema:
            format: date-time
            type: string
