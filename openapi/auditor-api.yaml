openapi: 3.0.0
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    PageInfo:
      description: Provides information about the pagination of a dataset.
      properties:
        endCursor:
          type: string
          nullable: true
          description:
            The cursor that points to the end of the current page, or null if
            there is no such cursor.
        hasNextPage:
          type: boolean
          description: Indicates if there is another page after the current page.
        hasPreviousPage:
          type: boolean
          description: Indicates if there is a page before the current page.
        startCursor:
          type: string
          nullable: true
          description:
            The cursor that points to the start of the current page, or null if
            there is no such cursor.
      required:
        - endCursor
        - hasNextPage
        - hasPreviousPage
        - startCursor
      type: object
      additionalProperties: false
    AuditFocus:
      type: string
      enum:
        - EXTERNAL
        - INTERNAL
    AuditView:
      type: string
      enum:
        - FULL
        - CONTROLLED
    AuditIrlGenerationStatus:
      type: string
      enum:
        - PENDING
        - RUNNING
        - READY
        - FAILED
    AuditSegmentKind:
      type: string
      enum:
        - PROGRAM
        - SYSTEM
    AuditSegmentFramework:
      description: The framework this segment is in.
      properties:
        displayName:
          type: string
          description: Display name of the framework.
      required:
        - displayName
      type: object
      additionalProperties: false
    AuditSegmentAssociation:
      description: A business unit or information-system association on an audit segment.
      properties:
        id:
          type: string
          description: The unique identifier of the associated business unit or
            information system.
        displayName:
          type: string
          description:
            The human-readable name of the associated business unit or
            information system.
      required:
        - id
        - displayName
      type: object
      additionalProperties: false
    AuditSoc2ReportType:
      type: string
      enum:
        - soc2type1
        - soc2type2
    AuditSoc2Tsc:
      type: string
      enum:
        - SECURITY
        - AVAILABILITY
        - CONFIDENTIALITY
        - PRIVACY
        - PROCESSING_INTEGRITY
    AuditSoc2Deliverable:
      description: >-
        Per-segment SOC 2 report configuration. Null when the segment is not SOC
        2

        or has no configured deliverable.
      properties:
        reportType:
          $ref: "#/components/schemas/AuditSoc2ReportType"
          description: SOC 2 report type for this segment.
        tscs:
          items:
            $ref: "#/components/schemas/AuditSoc2Tsc"
          type: array
          description: Trust Services Criteria this segment covers.
      required:
        - reportType
        - tscs
      type: object
      additionalProperties: false
    AuditSegment:
      description: >-
        One segment of an audit's scope. A live audit returns every in-scope
        program

        and system segment; more than one segment does not by itself imply more
        than

        one framework. Soft-deleted audits return an empty list. `displayName`
        is the

        segment label owned by audit scope

        (for example "{Framework}" or "{Framework} — {Business Unit}").

        `soc2Deliverable` is the per-segment SOC 2 config, or null.
        `businessUnit`

        is set for program segments that are BU-scoped and null otherwise.
        `system`

        is set for system segments and null otherwise.
      properties:
        id:
          type: string
          description: The unique identifier for the segment.
        kind:
          $ref: "#/components/schemas/AuditSegmentKind"
          description:
            Whether this segment is a program (framework / business unit) or a
            system.
        displayName:
          type: string
          description:
            The segment's display label. Do not reconstruct this from framework
            + BU.
        framework:
          $ref: "#/components/schemas/AuditSegmentFramework"
          description: The framework this segment is in.
        businessUnit:
          allOf:
            - $ref: "#/components/schemas/AuditSegmentAssociation"
          nullable: true
          description: >-
            The business unit this program segment is scoped to, or null when
            the

            segment is not BU-scoped or the BU cannot be resolved.
        system:
          allOf:
            - $ref: "#/components/schemas/AuditSegmentAssociation"
          nullable: true
          description: |-
            The information system this system segment is scoped to, or null on
            program segments.
        soc2Deliverable:
          allOf:
            - $ref: "#/components/schemas/AuditSoc2Deliverable"
          nullable: true
          description:
            SOC 2 report type and Trust Services Criteria for this segment, or
            null.
      required:
        - id
        - kind
        - displayName
        - framework
        - businessUnit
        - system
        - soc2Deliverable
      type: object
      additionalProperties: false
    Audit:
      properties:
        id:
          type: string
          description: The unique identifier for the audit.
        customerOrganizationName:
          type: string
          description:
            The domain name of the customer organization being audited (e.g.
            vanta.com)
        customerDisplayName:
          type: string
          nullable: true
          description:
            The human readable name of the customer organization being audited
            (e.g. Vanta)
        customerOrganizationId:
          type: string
          description: The uuid of the customer organization being audited
        auditStartDate:
          type: string
          format: date-time
          description:
            The start of the audit window. This is also when data collection
            for audit starts.
        auditEndDate:
          type: string
          format: date-time
          description: The end of the audit window.
        earlyAccessStartsAt:
          type: string
          format: date-time
          nullable: true
          description:
            Timestamp at which auditors gain access to the audit. Occurs before
            the audit window begins
        framework:
          type: string
          description: >-
            Legacy singular framework display name from the audit type.
            Incomplete for

            a multi-framework audit — use `segments` instead.
          deprecated: true
        displayName:
          type: string
          description: >-
            The display name for the audit. Returns the custom audit name if
            set,

            otherwise returns the framework name.
        allowAuditorEmails:
          items:
            type: string
          type: array
          description: Emails of auditors with access to audit
        allowAllAuditors:
          type: boolean
          description: Set to true if all auditors in audit firm have access
        deletionDate:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the audit was deleted
        creationDate:
          type: string
          format: date-time
          description: Timestamp when the audit was created
        modificationDate:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the audit was updated
        completionDate:
          type: string
          format: date-time
          nullable: true
          description:
            Timestamp when the audit was marked completed, and report was
            uploaded
        auditFocus:
          $ref: "#/components/schemas/AuditFocus"
          description: Audit focus determines if the audit is internal or external facing
        auditView:
          $ref: "#/components/schemas/AuditView"
          description:
            "How much population data the auditor can see: `FULL` (Full Audit
            View) or `CONTROLLED` (Controlled Audit View). Some population
            endpoints serve only one view; each endpoint's description says
            which."
        irlGenerationStatus:
          allOf:
            - $ref: "#/components/schemas/AuditIrlGenerationStatus"
          nullable: true
          description: >-
            Generation status of this audit's Vanta-generated information
            request list

            (IRL). `PENDING`/`RUNNING` defer initial sync, `READY` permits a
            full sync,

            and `FAILED` is terminal. Null means the audit has no generated IRL.
        auditorRequestListMetadata:
          properties:
            requestsSharedWithCustomer:
              type: string
              format: date-time
              nullable: true
              description:
                Timestamp when information requests were shared with the customer.
                Null if not shared.
          required:
            - requestsSharedWithCustomer
          type: object
          description: >-
            Metadata about the auditor request list. This field is only present
            for IRL (Information

            Request List) based audits and will be undefined for standard
            audits. Use the presence

            of this field to differentiate between IRL and non-IRL audits.
        segments:
          items:
            $ref: "#/components/schemas/AuditSegment"
          type: array
          description: >-
            The audit's scope as a list of segments. Always present. A live
            audit

            returns every in-scope program and system segment; more than one
            segment

            does not by itself imply more than one framework. Soft-deleted
            audits

            return an empty list. Prefer this over the deprecated top-level
            `framework`

            field.
      required:
        - id
        - customerOrganizationName
        - customerDisplayName
        - customerOrganizationId
        - auditStartDate
        - auditEndDate
        - earlyAccessStartsAt
        - framework
        - displayName
        - allowAuditorEmails
        - allowAllAuditors
        - deletionDate
        - creationDate
        - modificationDate
        - completionDate
        - auditFocus
        - auditView
        - irlGenerationStatus
        - segments
      type: object
      additionalProperties: false
    PaginatedResponse_Audit_:
      properties:
        results:
          properties:
            data:
              items:
                $ref: "#/components/schemas/Audit"
              type: array
            pageInfo:
              $ref: "#/components/schemas/PageInfo"
          required:
            - data
            - pageInfo
          type: object
      required:
        - results
      type: object
      additionalProperties: false
    ListAuditsPageSize:
      type: integer
      format: int32
      default: 10
      description: >-
        Controls the maximum number of items returned in one response from the
        listAudits API.


        We have increased the pagination size for this endpoint to enable our
        upmarket audit firms to

        sync in a timely manner. The rest of the API will use a pagination size
        of 100.
      minimum: 1
      maximum: 200
    PageCursor:
      type: string
      description: >-
        A marker or pointer, telling the API where to start fetching items for
        the subsequent page in a paginated dataset.

        Note that the requested page will not include the item that corresponds
        to this cursor but will start from the one immediately

        after this cursor.
    VendorAuthenticationMethod:
      description: >-
        The authentication method a vendor uses:

        - AUTH_0: The vendor authenticates using Auth0

        - AZURE_AD: The vendor authenticates using Azure Active Directory

        - G_SUITE: The vendor authenticates using Google Workspace

        - O_AUTH: The vendor authenticates using OAuth

        - O365: The vendor authenticates using Office 365

        - OKTA: The vendor authenticates using Okta

        - ONE_LOGIN: The vendor authenticates using OneLogin

        - OWA: The vendor authenticates using OWA

        - SSO: The vendor authenticates using SSO

        - USERNAME_PASSWORD: The vendor authenticates using usernames and
        passwords
      enum:
        - AUTH_0
        - AZURE_AD
        - GOOGLE_WORKSPACE
        - O_AUTH
        - O365
        - OKTA
        - ONE_LOGIN
        - OWA
        - SSO
        - USERNAME_PASSWORD
        - OTHER
      type: string
    VendorStatus:
      description: |-
        The current state of a vendor:
        - MANAGED: The vendor is actively managed.
        - ARCHIVED: The vendor has been archived
        - IN_PROCUREMENT: The vendor is in the procurement process
      enum:
        - MANAGED
        - ARCHIVED
        - IN_PROCUREMENT
      type: string
    VendorRiskLevel:
      description: |-
        The risk level of a vendor:
        - CRITICAL: The vendor has a critical security risk
        - HIGH: The vendor has a high security risk
        - MEDIUM: The vendor has a medium security risk
        - LOW: The vendor has a low security risk
        - UNSCORED: The vendor has not been given a risk level
      enum:
        - CRITICAL
        - HIGH
        - LOW
        - MEDIUM
        - UNSCORED
      type: string
