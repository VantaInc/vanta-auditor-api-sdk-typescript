          type: object
      required:
        - results
      type: object
      additionalProperties: false
    PaginatedIssueSnapshotMetadataResponse:
      $ref: "#/components/schemas/PaginatedResponse_IssueSnapshotMetadata_"
    AuditIntegration:
      description: |-
        Integration row returned by the auditor integrations API.

        `id` and `name` are always present. Other fields are optional to support
        controlled audits where only approved columns are returned.
      properties:
        id:
          type: string
          description: Integration identifier.
          example: github
        name:
          type: string
          description: Display name of the integration.
          example: GitHub
        segmentIds:
          items:
            type: string
          type: array
          description: |-
            IDs of the audit segments this integration is in scope for.
            Omitted when segment scoping is disabled.
        tags:
          items:
            type: string
          type: array
          description:
            Integration tag display names describing what data this integration
            provides.
          example:
            - Vulnerabilities
            - Code changes
        categories:
          items:
            type: string
          type: array
          description: Category display names describing what the integration is used for.
          example:
            - Version control systems
      required:
        - id
        - name
      type: object
      additionalProperties: false
    PaginatedResponse_AuditIntegration_:
      properties:
        results:
          properties:
            data:
              items:
                $ref: "#/components/schemas/AuditIntegration"
              type: array
            pageInfo:
              $ref: "#/components/schemas/PageInfo"
          required:
            - data
            - pageInfo
          type: object
      required:
        - results
      type: object
      additionalProperties: false
    AuditIntegrationTag:
      enum:
        - ACCESS
        - COMPUTERS
        - CUSTOM_RESOURCE
        - DATA_LOSS_PREVENTION
        - DOCUMENTS
        - DOCUMENT_UPLOAD
        - FRAMEWORK
        - GROUPS
        - INVENTORY
        - NOTIFICATIONS
        - PEOPLE
        - POLICIES
        - SECURITY_AWARENESS_TRAINING
        - SECURITY_SCANNER_ALERTS
        - SSO
        - TASK_CREATION
        - TASK_TRACKING
        - TRUST_CENTER
        - VENDOR_DISCOVERY
        - VENDOR_PROCUREMENT
        - VULNERABILITIES
      type: string
    AuditIntegrationCategory:
      enum:
        - ATS_MERGE_ACCOUNT
        - BACKGROUND_CHECK_SERVICE
        - CLOUD_PROVIDER
        - COMMUNICATION_PLATFORM
        - CRM_MERGE_ACCOUNT
        - CRM_PLATFORM
        - DATASTORE_PROVIDER
        - DATA_LOSS_PREVENTION
        - DATA_WAREHOUSE_PROVIDER
        - DOCUMENT_MANAGEMENT_TOOL
        - ENDPOINT_SECURITY_TOOL
        - HR_PROVIDER
        - IDENTITY_PROVIDER
        - INCIDENT_MANAGEMENT_TOOL
        - MOBILE_DEVICE_MANAGEMENT_TOOL
        - MONITORING_SERVICE
        - OTHER_INTEGRATION
        - SECURITY_AWARENESS_TRAINING_PROVIDER
        - SECURITY_SCANNER_ALERTS
        - TASK_TRACKER
        - VERSION_CONTROL_SYSTEM
        - VULNERABILITY_SCANNER
      type: string
    InformationRequestApprovalStatus:
      type: string
      enum:
        - NEEDS_EVIDENCE
        - READY_FOR_AUDIT
        - AUDITOR_APPROVED
        - AUDITOR_FLAGGED
      description: >-
        Current approval status of the information request, tracking its
        lifecycle through the audit process.


        The status progresses through the workflow: initial state → awaiting
        review → approved or flagged.

        Status can move between awaiting review and flagged states as evidence
        is reviewed and resubmitted.
    InformationRequestCadence:
      type: string
      enum:
        - ANNUALLY
        - BIANNUALLY
        - MONTHLY
        - QUARTERLY
      description:
        Frequency cadence for the information request, indicating how often
        it recurs.
    InformationRequestType:
      type: string
      enum:
        - POINT_IN_TIME
        - POPULATION
        - SAMPLE
      description: >-
        Type of information request, defining what scope of evidence is needed.


        - POINT_IN_TIME: Evidence for a specific moment (e.g., current state of
        a policy)

        - POPULATION: Evidence covering all items in a category (e.g., all
        employees)

        - SAMPLE: Evidence for a representative sample (e.g., 10 random customer
        records)
    ResourceOwner:
      anyOf:
        - properties:
            displayName:
              type: string
            id:
              type: string
            type:
              type: string
              enum:
                - user
              nullable: false
          required:
            - displayName
            - id
            - type
          type: object
        - properties:
            displayName:
              type: string
            id:
              type: string
            type:
              type: string
              enum:
                - team
              nullable: false
          required:
            - displayName
            - id
            - type
          type: object
      description: Represents either a user or a team owning a resource.
    InformationRequest:
      description: >-
        Information Request resource representing a single request for audit
        evidence from a customer.


        An information request is created by an auditor and shared with the
        customer organization.

        The customer then uploads evidence, which the auditor reviews and either
        approves or flags

        for issues.
      properties:
        id:
          type: string
          description: >-
            The unique identifier for the information request within Vanta's
            system.

            This is the primary identifier used in all API endpoints.

            Format: ObjectId as a string (e.g., "6890e473dce1da5d8406f5e7")
        uniqueId:
          type: string
          description: >-
            External unique ID to prevent duplicates across different audit
            systems.

            Used for idempotency when syncing data between external audit
            management

            systems and Vanta. Unlike `id`, this value is provided by the
            external system.
        additionalControlIds:
          items:
            type: string
          type: array
          description: >-
            Deprecated control-linkage field retained for response
            compatibility. It

            may contain control IDs supplied directly to the request, but it is
            not a

            complete or guaranteed-current list of controls linked to the
            request. Use

            `linkedControlIds` for the complete current list.
          deprecated: true
        linkedControlIds:
          items:
            type: string
          type: array
          description: >-
            The complete current set of control IDs linked to this request,
            including

            controls linked through framework codes and controls added directly.
            Each

            ID is returned by the audit controls endpoint.
        approvalStatus:
          $ref: "#/components/schemas/InformationRequestApprovalStatus"
          description: >-
            Current approval status tracking the request's lifecycle through
            evidence

            submission and auditor review.
        cadence:
          allOf:
            - $ref: "#/components/schemas/InformationRequestCadence"
          nullable: true
          description: >-
            How frequently this information request recurs (e.g., annual
            password

            policy reviews). Null for one-time requests.
        frameworkCodes:
          items:
            type: string
          type: array
          description: |-
            Always empty on read. Use `linkedControlIds` for control linkage and
            `segmentIds` for request assignment.
          deprecated: true
        segmentIds:
          items:
            type: string
          type: array
          description: >-
            Audit segments this request is assigned to. Empty means unassigned.

            Resolved against the current audit scope — stale IDs are dropped.


            This field is a current-scope projection, not a stored watermark. An

            audit-scope change that drops or adds IDs here does not update

            creationDate, modificationDate, or deletionDate, so it does not
            appear in

            `changedSinceDate` delta sync on its own. Re-fetch the list without
            that

            parameter, or GET the request by id, to see the current projection.
        description:
          type: string
          nullable: true
          description: >-
            Detailed description explaining what evidence is needed and why.

            Should provide clear instructions to help the customer understand
            what

            to submit.
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: |-
            The deadline by which the customer must fulfill this request.
            Null if no specific deadline is set. Format: ISO 8601 UTC timestamp.
        evidenceCaptureDate:
          type: string
          format: date-time
          nullable: true
          description: |-
            The earliest date for which evidence should be captured.
            Evidence dated before this date may not be accepted.
            Null if not restricted. Format: ISO 8601 UTC timestamp.
        requestId:
          type: string
          nullable: true
          description: >-
            Non-unique external reference ID for this request.

            Unlike `uniqueId` which must be unique, `requestId` is for
            display/reference

            purposes only (e.g., "REQ-123"). Null if not provided.
        requestType:
          $ref: "#/components/schemas/InformationRequestType"
          description: Defines the scope of evidence required.
        title:
          type: string
          description: Short, descriptive title summarizing what is being requested.
        creationDate:
          type: string
          format: date-time
          description: |-
            Timestamp when the request was created in the system.
            Format: ISO 8601 UTC timestamp.
        modificationDate:
          type: string
          format: date-time
          description: |-
            Timestamp when the request was last modified.
            Format: ISO 8601 UTC timestamp.
        deletionDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Timestamp when the request was soft-deleted. Null if the request has
            not

            been deleted. Soft deletes allow retaining history while hiding the
            request

            from normal operations.

            Format: ISO 8601 UTC timestamp.
        ownerAssignment:
          allOf:
            - $ref: "#/components/schemas/ResourceOwner"
          nullable: true
          description: |-
            Resource owner (user or team) assigned to this information request.
            Returns null if no resource owner is assigned.
      required:
        - id
        - uniqueId
        - additionalControlIds
        - linkedControlIds
        - approvalStatus
        - cadence
        - frameworkCodes
        - segmentIds
        - description
        - dueDate
        - evidenceCaptureDate
        - requestId
        - requestType
        - title
        - creationDate
        - modificationDate
        - deletionDate
        - ownerAssignment
      type: object
      additionalProperties: false
    PaginatedResponse_InformationRequest_:
      properties:
        results:
          properties:
            data:
              items:
                $ref: "#/components/schemas/InformationRequest"
              type: array
            pageInfo:
              $ref: "#/components/schemas/PageInfo"
          required:
            - data
            - pageInfo
          type: object
      required:
        - results
      type: object
      additionalProperties: false
    CreateInformationRequestInput:
      description: |-
        Input for creating a new information request.
        New requests are created in an initial state by default.
      properties:
        uniqueId:
          type: string
          description: >-
            External unique ID to prevent duplicate requests across audit
            systems.

            Must be unique within the audit. Used for idempotency.
        title:
          type: string
          description: |-
            Short, descriptive title summarizing what is being requested.
            Must be at least 1 character.
        requestType:
          $ref: "#/components/schemas/InformationRequestType"
          description: Scope of evidence required.
        description:
          type: string
          nullable: true
          description: |-
            Detailed description explaining what evidence is needed.
            Helps the customer understand what to submit. Optional.
        frameworkCodes:
          items:
            type: string
          type: array
          description: |-
            Framework codes this request addresses.
            An empty array if no framework codes are associated.
        cadence:
          allOf:
            - $ref: "#/components/schemas/InformationRequestCadence"
          nullable: true
          description:
            How frequently this request recurs. Null or omitted for one-time
            requests.
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Deadline for fulfilling this request. Null or omitted if no
            deadline.

            Format: ISO 8601 UTC timestamp.
        evidenceCaptureDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Start date of the audit period. Evidence before this date may not be
            accepted.

            Null or omitted if not restricted.

            Format: ISO 8601 UTC timestamp.
        additionalControlIds:
          items:
            type: string
          type: array
          description: >-
            Control IDs to link directly to this request, beyond those
            automatically

            mapped from framework codes. Each must be the `id` of an existing
            control in

            the customer's organization (the identifier returned by the controls
            endpoints).

            Unknown IDs and controls without an active mapping to a framework in
            the audit are skipped.

            Omit or pass an empty array for no direct control links.
      required:
        - uniqueId
        - title
        - requestType
        - frameworkCodes
      type: object
      additionalProperties: false
    PartialUpdateInformationRequest:
      description: >-
        Input for partially updating an information request. Only provided
        fields

        will be updated; omitted fields remain unchanged. At least one field
        must

        be provided.
      properties:
        frameworkCodes:
          items:
            type: string
          type: array
          description: >-
            Framework codes are assigned only at creation; on update this field
            is a

            silent no-op — a value sent here is accepted for backwards
            compatibility

            but ignored, leaving the request's framework codes unchanged.
          deprecated: true
        description:
          type: string
          nullable: true
          description: Detailed description of what evidence is needed.
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: |-
            Deadline for fulfilling this request. Null if no deadline.
            Format: ISO 8601 UTC timestamp.
        evidenceCaptureDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Start date of the audit period. Evidence before this date may not be
            accepted.

            Null if not restricted. Format: ISO 8601 UTC timestamp.
        requestType:
          $ref: "#/components/schemas/InformationRequestType"
          description: Scope of evidence required.
        title:
          type: string
          description: Short, descriptive title.
        cadence:
          $ref: "#/components/schemas/InformationRequestCadence"
          description: How frequently this request recurs.
        additionalControlIds:
          items:
            type: string
          type: array
          description: >-
            This legacy field is accepted for backwards compatibility but
            ignored.

            Use `linkedControlIds` to replace the complete set of linked
            controls.
          deprecated: true
        linkedControlIds:
          items:
            type: string
          type: array
          description: >-
            The complete desired set of control IDs linked to this request. Send
            the

            full list to replace the set, an empty array to clear it, or omit
            the

            property to leave links unchanged. Each ID must identify an existing
            control

            in the customer's organization and is returned by the audit controls

            endpoint. The request is rejected if any ID does not match a
            control.
      type: object
      additionalProperties: false
    FlagInformationRequestEvidenceInput:
      description: >-
        Input for flagging evidence on an information request, indicating issues

        that need to be addressed. This changes the request's approvalStatus to

        a flagged state and creates an activity log entry.


        The customer will be notified and can resubmit evidence after addressing
        the issues.
      properties:
        auditorEmail:
          type: string
          description: >-
            Email of the auditor flagging the evidence.

            Must match an existing Vanta user who belongs to the audit firm
            making the API request.
        reason:
          type: string
          description: >-
            Detailed explanation of what issues were found with the evidence.

            This reason is visible to the customer and guides them on what to
            fix.

            Must be at least 1 character.
      required:
        - auditorEmail
        - reason
      type: object
      additionalProperties: false
    AcceptInformationRequestEvidenceInput:
      description: |-
        Input for accepting evidence on an information request, indicating that
        the submitted evidence meets requirements. This changes the request's
        approvalStatus to an approved state and creates an activity log entry.
      properties:
        auditorEmail:
          type: string
          description: >-
            Email of the auditor accepting the evidence.

            Must match an existing Vanta user who belongs to the audit firm
            making the API request.
      required:
        - auditorEmail
      type: object
      additionalProperties: false
    FrameworkCodesByFramework:
      properties:
        framework:
          type: string
          description: Display name of the in-scope framework these codes belong to.
        codes:
          items:
            type: string
          type: array
          description: Valid codes for this framework, sorted.
      required:
        - framework
        - codes
      type: object
      additionalProperties: false
    FrameworkCodes:
      description: Framework codes response resource
      properties:
        frameworkCodes:
          items:
            type: string
          type: array
          description: Valid framework codes for this audit.
          deprecated: true
        codesByFramework:
          items:
            $ref: "#/components/schemas/FrameworkCodesByFramework"
          type: array
          description: >-
            Valid codes grouped by each distinct in-scope framework. A code that
            exists

            on two frameworks appears in both groups. Two segments that share a

            framework contribute one group. `framework` is the display name.
      required:
        - frameworkCodes
        - codesByFramework
      type: object
      additionalProperties: false
    InformationRequestSupportedEvidenceType:
      type: string
      enum:
        - UPLOADED_DOCUMENT
        - OBSERVATION
        - LINK
        - VANTA_DOCUMENT
        - VANTA_POLICY
        - VANTA_TEST
        - VANTA_TEST_SNAPSHOT
    UploadedDocumentEvidence:
      title: UploadedDocumentEvidence
      description: >-
        Evidence in the form of an uploaded document file.

        The URL is a temporary presigned URL that expires after a certain
        period.
      properties:
        id:
          type: string
          description: The unique identifier for the uploaded document in Vanta's system.
        filename:
          type: string
          description: |-
            The original filename of the uploaded document.
            Undefined if the filename was not captured during upload.
        mimeType:
          type: string
          description: >-
            The MIME type of the document indicating its file format.

            Common types: "application/pdf", "image/png", "image/jpeg",
            "text/plain"
        url:
          type: string
          description: |-
            A presigned URL for downloading the document.
            This URL is temporary and expires after a limited time.
            Request a new evidence list to get a fresh URL if expired.
      required:
        - id
        - mimeType
        - url
      type: object
      additionalProperties: false
    LinkEvidence:
      title: LinkEvidence
      description: Evidence in the form of a link to external documentation or resources.
      properties:
        title:
          type: string
          description: The title or descriptive name for the link.
        description:
          type: string
          description: Optional description providing additional context about the link.
        url:
          type: string
          description: The URL pointing to the external documentation or resource.
      required:
        - title
        - url
      type: object
      additionalProperties: false
    ObservationEvidence:
      title: ObservationEvidence
      description: Evidence in the form of a text observation or note.
      properties:
        observationDetails:
          type: string
          description: The text content of the observation.
      required:
        - observationDetails
      type: object
      additionalProperties: false
    VantaDocumentUploadedEvidence:
      title: VantaDocumentUploadedEvidence
      description: |-
        Represents an uploaded file in a Vanta Document.
        The file is stored in Vanta's system and accessed via a presigned URL.
      properties:
        type:
          type: string
          enum:
            - uploaded
          nullable: false
          description: Discriminator to identify this as an uploaded file.
        id:
          type: string
          description: The unique identifier for the file version in Vanta's system.
        filename:
          type: string
          description: |-
            The original filename of the uploaded document.
            Undefined if the filename was not captured during upload.
        mimeType:
          type: string
          description: >-
            The MIME type of the document indicating its file format.

            Common types: "application/pdf", "image/png", "image/jpeg",
            "text/plain"
        url:
          type: string
          description: |-
            A presigned URL for downloading the document.
            This URL is temporary and expires after a limited time.
            Request a new evidence list to get a fresh URL if expired.
      required:
        - type
        - id
        - mimeType
        - url
      type: object
      additionalProperties: false
    VantaDocumentLinkEvidence:
      title: VantaDocumentLinkEvidence
      description: |-
        Represents an external link in a Vanta Document.
        The link points to documentation hosted outside of Vanta's system.
      properties:
        type:
          type: string
          enum:
            - link
          nullable: false
          description: Discriminator to identify this as an external link.
        id:
          type: string
          description: The unique identifier for the file version in Vanta's system.
        url:
          type: string
          description: The URL pointing to the external documentation or resource.
      required:
        - type
        - id
        - url
      type: object
      additionalProperties: false
    VantaDocumentEvidence:
      title: VantaDocumentEvidence
      description: >-
        Evidence in the form of a Vanta Document.

        Vanta Documents are managed documents with metadata like expiration
        dates

        and versioning. They can either be uploaded files stored in Vanta or

        links to external documentation.
      properties:
        title:
          type: string
          description: The title of the document as displayed in Vanta.
        description:
          type: string
          description: Optional description providing additional context about the document.
        expirationDate:
          type: string
          format: date-time
          description: |-
            The date when the document version expires and should be renewed.
            Undefined if no expiration is set.
            Format: ISO 8601 UTC timestamp.
        addedBy:
          properties:
            email:
              type: string
            name:
              type: string
          required:
            - email
            - name
          type: object
          description: >-
            Information about the user who added this file version to the
            document.

            Undefined if the user information is not available.
        documentVersionId:
          type: string
          description: The unique identifier of the document version submitted as evidence.
        file:
          anyOf:
            - $ref: "#/components/schemas/VantaDocumentUploadedEvidence"
            - $ref: "#/components/schemas/VantaDocumentLinkEvidence"
          description: >-
            The file or link associated with this document version.

            Use the `type` discriminator to determine whether it's an uploaded
            file

            or an external link.
      required:
        - title
        - documentVersionId
        - file
      type: object
      additionalProperties: false
    VantaPolicyEvidence:
      title: VantaPolicyEvidence
      description: |-
        Evidence in the form of a Vanta Policy.
        Vanta Policies are compliance policies with metadata like locale,
        effective dates, and versioning. Policies are always uploaded files
        stored in Vanta's system.
      properties:
        title:
          type: string
          description: The title of the policy as displayed in Vanta.
        description:
          type: string
          description: Optional description providing additional context about the policy.
        expirationDate:
          type: string
          format: date-time
          description: |-
            The date when the policy version expires and should be renewed.
            Undefined if no expiration is set.
            Format: ISO 8601 UTC timestamp.
        lastEditedBy:
          properties:
            email:
              type: string
            name:
              type: string
          required:
            - email
            - name
          type: object
          description: |-
            Information about the user who last edited this policy version.
            Undefined if the user information is not available.
        policyId:
          type: string
          description: >-
            The policy type this evidence belongs to (e.g.
            "information-security-policy-bsi").

            Policies prefixed with "custom-" are customer-defined; others are
            Vanta-provided templates.
        policyVersionId:
          type: string
          description: >-
            The identifier of the approved policy version that was submitted as
            evidence.

            A new version is created each time a policy is updated and approved.
        policyVersionFileId:
          type: string
          description: >-
            The identifier of the locale-specific file within the policy
            version.

            Each policy version may contain multiple files, one per supported
            language.
        file:
          properties:
            effectiveOrCreationDate:
              type: string
              format: date-time
              description: >-
                The date when this policy version became effective, or when it
                was created.

                Format: ISO 8601 UTC timestamp.
            locale:
              type: string
              description: |-
                The locale/language of the policy document.
                Examples: "EN" for English, "ES" for Spanish, "FR" for French
            url:
              type: string
              description: |-
                A presigned URL for downloading the policy document.
                This URL is temporary and expires after a limited time.
                Request a new evidence list to get a fresh URL if expired.
            mimeType:
              type: string
              description: |-
                The MIME type of the policy document indicating its file format.
                Common types: "application/pdf", "application/msword"
            filename:
              type: string
              description: |-
                The original filename of the uploaded policy document.
                Undefined if the filename was not captured during upload.
            id:
              type: string
              description:
                The unique identifier for the uploaded policy file in Vanta's
                system.
          required:
            - effectiveOrCreationDate
            - locale
            - url
            - mimeType
            - id
          type: object
          description: The uploaded policy file for this version.
      required:
        - title
        - policyId
        - policyVersionId
        - policyVersionFileId
        - file
      type: object
      additionalProperties: false
    VantaTestRunStatus:
      type: string
      enum:
        - NA
        - IN_PROGRESS
        - FAIL
        - PASS
        - INVALID
        - DISABLED
    VantaTestFileType:
      type: string
      enum:
        - TEST_EVIDENCE_WORKPAPER
        - TEST_RAW_DATA
        - OUT_OF_SCOPE_RESOURCES
        - API_REQUESTS
    VantaTestEvidence:
      title: VantaTestEvidence
      description: >-
        Evidence in the form of a Vanta automated test run.

        Vanta Tests are automated compliance tests with metadata like test
        status,

        execution time, and file type. Tests generate evidence files that can be

        workpapers, raw data, or API request logs.

        Each file in a snapshot is returned as a separate evidence item. These

        items share `testId` and `snapshotId` and differ by `fileType`.
      properties:
        title:
          type: string
          description: The title of the test run as displayed in Vanta.
        testId:
          type: string
          description: The unique identifier for the test in Vanta's system.
        snapshotId:
          type: string
          description: >-
            The unique identifier for the point-in-time capture of this test
            run's evidence.

            A snapshot is an immutable record of all files (workpapers, raw
            data, etc.)

            generated during a single test execution.
        testRunStatus:
          $ref: "#/components/schemas/VantaTestRunStatus"
          description: The outcome status of the test run.
        executedAt:
          type: string
          format: date-time
          description: |-
            The date and time when the test was executed.
            Format: ISO 8601 UTC timestamp.
        fileType:
          $ref: "#/components/schemas/VantaTestFileType"
          description: The type of evidence file included in this evidence.
        file:
          properties:
            mimeType:
              type: string
              description: >-
                The MIME type of the evidence file.

                Common types: "application/pdf" for workpapers, "text/csv" for
                raw data
            url:
              type: string
              description: |-
                A presigned URL for downloading the evidence file.
                This URL is temporary and expires after a limited time.
                Request a new evidence list to get a fresh URL if expired.
          required:
            - mimeType
            - url
          type: object
          description: The evidence file for this test run.
      required:
        - title
        - testId
        - snapshotId
        - testRunStatus
        - executedAt
        - fileType
        - file
      type: object
      additionalProperties: false
    VantaTestSnapshotEvidence:
      title: VantaTestSnapshotEvidence
      description: >-
        Evidence in the form of a Vanta automated test run snapshot.


        Unlike VantaTestEvidence (which represents a single file within a test
        run's

        evidence packet), a snapshot represents the entire test-run bundle. Use
        the

        dedicated snapshot detail endpoint to retrieve the files associated with
        a

        snapshot.
      properties:
        snapshotId:
          type: string
          description: >-
            The unique identifier for the point-in-time capture of this test
            run's evidence.

            A snapshot is an immutable record of all files (workpapers, raw
            data, etc.)

            generated during a single test execution.
        testId:
          type: string
          description: The unique identifier for the test in Vanta's system.
        testRunId:
          type: string
          description:
            The unique identifier for the test run this snapshot was captured
            from.
        testRunTitle:
          type: string
          description: The title of the test run as displayed in Vanta.
        testRunStatus:
          type: string
          enum:
            - NA
            - IN_PROGRESS
            - FAIL
            - PASS
            - INVALID
            - DISABLED
          description: The outcome status of the test run.
        testRunExecutedAt:
          type: string
          format: date-time
          description: |-
            The date and time when the test was executed.
            Format: ISO 8601 UTC timestamp.
      required:
        - snapshotId
        - testId
        - testRunId
        - testRunTitle
        - testRunStatus
        - testRunExecutedAt
      type: object
      additionalProperties: false
    InformationRequestEvidenceUnion:
      anyOf:
        - $ref: "#/components/schemas/UploadedDocumentEvidence"
        - $ref: "#/components/schemas/LinkEvidence"
        - $ref: "#/components/schemas/ObservationEvidence"
        - $ref: "#/components/schemas/VantaDocumentEvidence"
        - $ref: "#/components/schemas/VantaPolicyEvidence"
        - $ref: "#/components/schemas/VantaTestEvidence"
        - $ref: "#/components/schemas/VantaTestSnapshotEvidence"
      description: >-
        Union type representing the different forms of evidence content.

        The specific type is determined by the `evidenceType` field in
        InformationRequestEvidence.
    InformationRequestEvidence:
      properties:
        id:
          type: string
          description: |-
            The unique identifier for the evidence within Vanta's system.
            Use it as the key when you sync evidence of any type.
            Each evidence item has at most one file. A file attached to two
            information requests appears as two evidence items with
            different IDs.
            Format: ObjectId as a string (e.g., "6890e473dce1da5d8406f5e7").
        evidenceType:
          $ref: "#/components/schemas/InformationRequestSupportedEvidenceType"
          description: |-
            Type of evidence attached to this information request.
            Determines the structure of the `evidence` field.
        visibleToAuditorDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Timestamp when the evidence was made visible to the auditor.

            Null if the customer has not yet shared this evidence with the
            auditor.

            Evidence must be shared before the auditor can review it.

            Format: ISO 8601 UTC timestamp.
        creationDate:
          type: string
          format: date-time
          description: |-
            Timestamp when the evidence was created/uploaded.
            Format: ISO 8601 UTC timestamp.
        modificationDate:
          type: string
          format: date-time
          description: |-
            Timestamp when the evidence was last modified.
            Format: ISO 8601 UTC timestamp.
        deletionDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Timestamp when the evidence was soft-deleted.

            Null if the evidence has not been deleted.

            Soft deletes retain evidence in the system for audit history while
            hiding

            it from normal operations.

            Format: ISO 8601 UTC timestamp.
        capturedSegmentIds:
          items:
            type: string
          type: array
          description: >-
            IDs of the audit segments this evidence was relevant to when
            captured.

            Empty for uploaded, link and observation evidence, and for evidence
            captured before attribution was recorded.
        evidence:
          $ref: "#/components/schemas/InformationRequestEvidenceUnion"
          description: The evidence content. Structure varies based on evidenceType.
      required:
        - id
        - evidenceType
        - creationDate
        - modificationDate
        - capturedSegmentIds
        - evidence
      type: object
      additionalProperties: false
    PaginatedResponse_InformationRequestEvidence_:
      properties:
        results:
          properties:
            data:
              items:
                $ref: "#/components/schemas/InformationRequestEvidence"
              type: array
            pageInfo:
              $ref: "#/components/schemas/PageInfo"
          required:
            - data
            - pageInfo
          type: object
      required:
        - results
      type: object
      additionalProperties: false
    VantaTestSnapshotIntegration:
      description: Integration metadata for a test, mirroring the Vanta web app.
      properties:
        integrationId:
          type: string
        displayName:
          type: string
      required:
        - integrationId
        - displayName
      type: object
      additionalProperties: false
    VantaTestSnapshotSlaRemediationSettings:
      properties:
        numericValue:
          type: number
          format: double
        unit:
          type: string
          nullable: true
      required:
        - numericValue
        - unit
      type: object
      additionalProperties: false
    VantaTestSnapshotSlaRemediation:
      properties:
        id:
          type: string
        settings:
          allOf:
            - $ref: "#/components/schemas/VantaTestSnapshotSlaRemediationSettings"
          nullable: true
      required:
        - id
        - settings
      type: object
      additionalProperties: false
    VantaTestSnapshotRawTestDataRow:
      description: >-
        One row of raw test data attached to a snapshot.


        For structured snapshots, every row carries the resource refs and the
        raw

        JSON for that resource. For unstructured snapshots, a single row is
        returned

        with `resourceId` and `resourceType` set to `null` and `rawJson`
        containing

        the entire test-run JSON blob.
      properties:
        resourceId:
          type: string
          nullable: true
          description: >-
            Identifier of the underlying resource the row was captured from.
            Null for

            unstructured snapshots, which do not partition by resource.
        resourceType:
          type: string
          nullable: true
          description: |-
            Specific resource kind for the row (e.g. `AwsIamUser`). Null for
            unstructured snapshots.
        rawJson:
          description: >-
            Raw JSON payload as emitted by the test runner. Shape varies by

            `resourceType` for structured snapshots and matches the full
            test-run

            blob for unstructured snapshots.
      required:
        - resourceId
        - resourceType
        - rawJson
      type: object
      additionalProperties: false
    VantaTestSnapshotExcludedItem:
      properties:
        id:
          type: string
        displayName:
          type: string
          nullable: true
      required:
        - id
        - displayName
      type: object
      additionalProperties: false
    VantaTestSnapshotExcludedItemGroup:
      properties:
        reason:
          type: string
        entities:
          items:
            $ref: "#/components/schemas/VantaTestSnapshotExcludedItem"
          type: array
      required:
        - reason
        - entities
      type: object
      additionalProperties: false
    VantaTestSnapshotFrameworkExclusion:
      properties:
        frameworkId:
          type: string
        frameworkName:
          type: string
        groupedByReason:
          items:
            $ref: "#/components/schemas/VantaTestSnapshotExcludedItemGroup"
          type: array
      required:
        - frameworkId
        - frameworkName
        - groupedByReason
      type: object
      additionalProperties: false
    VantaTestSnapshotOutOfScopeResources:
      description: |-
        Resources excluded from the test at snapshot time, grouped by exclusion
        reason.  `testLevel` contains resources the customer disabled for the
        test; `frameworkLevel` contains resources scoped out by the framework's
        segment configuration.
      properties:
        testLevel:
          items:
            $ref: "#/components/schemas/VantaTestSnapshotExcludedItemGroup"
          type: array
        frameworkLevel:
          items:
            $ref: "#/components/schemas/VantaTestSnapshotFrameworkExclusion"
          type: array
      required:
        - testLevel
        - frameworkLevel
      type: object
      additionalProperties: false
    VantaTestSnapshotApiRequest:
      description: A single API request captured during an API introspection test run.
      properties:
        id:
          type: string
        resourceType:
          type: string
        resourceTypeDisplayName:
          type: string
        requestMethod:
          type: string
        url:
          type: string
        responseCode:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
        dataTooLarge:
          type: boolean
      required:
        - id
        - resourceType
        - resourceTypeDisplayName
        - requestMethod
        - url
        - responseCode
        - timestamp
        - dataTooLarge
      type: object
      additionalProperties: false
    VantaTestSnapshotEvidenceDetail:
      description: |-
        Detail response for a captured automated-test snapshot evidence row.

        Combines the test-level metadata (description, integrations, SLA
        remediation) with a uniform raw-data array so external clients see the
        same shape regardless of whether the snapshot was structured or
        unstructured.
      properties:
        testId:
          type: string
          description: The unique identifier for the test in Vanta's system.
        testName:
          type: string
          description: The display name of the test.
        description:
          type: string
          description: A short description of what the test checks.
        evaluationCriteria:
          type: string
          nullable: true
          description: Longer-form, formatted description of the test. Null when unset.
        integrations:
          items:
            $ref: "#/components/schemas/VantaTestSnapshotIntegration"
          type: array
          description: Integrations whose data feeds the test.
        slaRemediation:
          allOf:
            - $ref: "#/components/schemas/VantaTestSnapshotSlaRemediation"
          nullable: true
          description:
            SLA remediation policy attached to the test, or null when no SLA is
            set.
        rawTestData:
          items:
            $ref: "#/components/schemas/VantaTestSnapshotRawTestDataRow"
          type: array
          description: Raw test data captured at snapshot time.
        outOfScopeResources:
          $ref: "#/components/schemas/VantaTestSnapshotOutOfScopeResources"
          description: |-
            Resources excluded from the test at snapshot time. Absent when the
            snapshot data could not be loaded; clients should treat a missing
            field as "unknown" rather than "nothing excluded".
        apiRequests:
          items:
            $ref: "#/components/schemas/VantaTestSnapshotApiRequest"
          type: array
          description: |-
            API requests captured during the test run. Absent when the snapshot
            data could not be loaded. Empty array when the test does not perform
            API introspection.
      required:
        - testId
        - testName
        - description
        - evaluationCriteria
        - integrations
        - slaRemediation
        - rawTestData
      type: object
      additionalProperties: false
    InformationRequestComment:
      description: >-
        A comment on an information request enables communication between
        auditors

        and customers regarding evidence requirements and submissions.


        These threaded discussions help clarify requests, explain or resolve
        questions about evidence,

        and are always visible to both parties once created.
      properties:
        id:
          type: string
          description: |-
            The unique identifier for the comment within Vanta's system.
            Format: ObjectId as a string (e.g., "6890e473dce1da5d8406f5e7").
        text:
          type: string
          description: >-
            The comment message content.

            Can include explanations, questions, or clarifications about the
            information request.
        creationDate:
          type: string
          format: date-time
          description: |-
            Timestamp when the comment was created.
            Format: ISO 8601 UTC timestamp.
        modificationDate:
          type: string
          format: date-time
          nullable: true
          description: |-
            Timestamp when the comment was last edited.
            Null if the comment has never been modified.
            Format: ISO 8601 UTC timestamp.
        deletionDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Timestamp when the comment was soft-deleted.

            Null if the comment has not been deleted.

            Soft deletes retain the comment for audit history while hiding it
            from normal operations.

            Format: ISO 8601 UTC timestamp.
        email:
          type: string
          nullable: true
          description: >-
            Email address of the comment author.

            This email uniquely identifies users between Vanta and external
            audit systems.

            Null when the comment author can't be matched to a Vanta user.
        authorName:
          type: string
          nullable: true
          description: >-
            Human-readable display name of the comment author.

            Null if the author's name is not available (e.g., user was deleted).

            This enables correct author attribution in integrations where users
            cannot

            be reliably matched across systems by email alone.
      required:
        - id
        - text
        - creationDate
        - modificationDate
        - deletionDate
        - email
        - authorName
      type: object
      additionalProperties: false
    PaginatedResponse_InformationRequestComment_:
      properties:
        results:
          properties:
            data:
              items:
                $ref: "#/components/schemas/InformationRequestComment"
              type: array
            pageInfo:
              $ref: "#/components/schemas/PageInfo"
          required:
            - data
            - pageInfo
          type: object
      required:
        - results
      type: object
      additionalProperties: false
    AddInformationRequestCommentInput:
      description: |-
        Comments enable communication between auditors and customers about
        evidence requirements and submissions. All comments are immediately
        visible to both parties once created.
      properties:
        text:
          type: string
          description: |-
            The text content of the comment.
            Must be at least 1 character. Can include questions, clarifications,
            or explanations related to the information request.
        email:
          type: string
          description: >-
            Email address of the comment author.

            Must match an existing Vanta user who belongs to the audit firm
            making the API request.

            This email uniquely identifies the author across systems.
        creationDate:
          type: string
          format: date-time
          description: >-
            Timestamp when the comment was created in the external audit
            management system.

            This allows synchronizing comment timestamps from external systems.

            Format: ISO 8601 UTC timestamp.
      required:
        - text
        - email
        - creationDate
      type: object
      additionalProperties: false
    UpdateInformationRequestCommentInput:
      description: |-
        Updates an existing comment on an information request.
        Only the original author of the comment can update it.
      properties:
        text:
          type: string
          description: |-
            The text content of the comment.
            Must be at least 1 character. Can include questions, clarifications,
            or explanations related to the information request.
        email:
          type: string
          description: >-
            Email address of the comment author.

            Must match an existing Vanta user who belongs to the audit firm
            making the API request.

            This email uniquely identifies the author across systems.
      required:
        - text
        - email
      type: object
      additionalProperties: false
    DeleteInformationRequestCommentInput:
      description: |-
        Deletes an existing comment on an information request.
        Only the original author of the comment can delete it.
      properties:
        email:
          type: string
          description: >-
            Email address of the comment author.

            Must match an existing Vanta user who belongs to the audit firm
            making the API request.

            This email uniquely identifies the author across systems.
      required:
        - email
      type: object
      additionalProperties: false
    InformationRequestAuditorFileUploader:
      description: The auditor who uploaded the file.
      properties:
        email:
          type: string
        name:
          type: string
      required:
        - email
        - name
      type: object
      additionalProperties: false
    InformationRequestAuditorFile:
      description: A file an auditor shared with the customer on an information request.
      properties:
        id:
          type: string
        filename:
          type: string
          description:
            The filename, falling back to the title or document ID when
            unavailable.
        mimeType:
          type: string
          description: The stored MIME type, or application/octet-stream when unavailable.
        url:
          type: string
          description: >-
            A temporary download link that expires one hour after it is

            issued. List the files again for a fresh link. Do not use it as a
            key.

            Use `filename` when saving the download; the URL does not supply a
            filename.
        uploadedBy:
          allOf:
            - $ref: "#/components/schemas/InformationRequestAuditorFileUploader"
          nullable: true
          description: Null when the uploader's account no longer exists.
        uploadedDate:
          type: string
          format: date-time
      required:
        - id
        - filename
        - mimeType
        - url
        - uploadedBy
        - uploadedDate
      type: object
      additionalProperties: false
    PaginatedResponse_InformationRequestAuditorFile_:
      properties:
        results:
          properties:
            data:
              items:
                $ref: "#/components/schemas/InformationRequestAuditorFile"
              type: array
            pageInfo:
              $ref: "#/components/schemas/PageInfo"
          required:
            - data
            - pageInfo
          type: object
      required:
        - results
      type: object
      additionalProperties: false
    DeleteInformationRequestAuditorFileInput:
      properties:
        email:
          type: string
          description: >-
            The email of the auditor deleting the file. They must be an active
            user in

            your audit firm and assigned to the audit.
      required:
        - email
      type: object
      additionalProperties: false
    AuditorFileUploadFormFields:
      description: >-
        Multipart form fields for one upload. Copy every returned name and value

        unchanged into the multipart POST, then append the file as the final
        part.

        Field names may vary between uploads.
      properties: {}
      type: object
      additionalProperties:
        type: string
    AuditorFileUploadGrant:
      properties:
        uploadId:
          type: string
        url:
          type: string
          description:
            Submit a multipart POST to this URL with every returned field and
            the file last.
        fields:
          $ref: "#/components/schemas/AuditorFileUploadFormFields"
        maxSizeBytes:
          type: number
          format: double
          description: Inclusive byte limit for the file.
        transferExpiresAt:
          type: string
          format: date-time
          description:
            Start the multipart POST to `url` before this time; the signed
            storage-upload form expires then.
        finalizationExpiresAt:
          type: string
          format: date-time
          description:
            Finish finalization before this time to attach the file. The upload
            session expires then, even if the file is already in storage.
      required:
        - uploadId
        - url
        - fields
        - maxSizeBytes
        - transferExpiresAt
        - finalizationExpiresAt
      type: object
      additionalProperties: false
    InitiateAuditorFileUploadInput:
      properties:
        email:
          type: string
          description: Active auditor in the calling firm who has access to the audit.
        filename:
          type: string
        contentType:
          type: string
          description: |-
            The file's declared MIME type. Accepted values:
            - `application/json`
            - `application/pdf`
            - `application/postscript`
            - `application/vnd.openxmlformats-officedocument.wordprocessingml.document`
            - `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`
            - `application/x-zip-compressed`
            - `application/zip`
            - `image/jpeg`
            - `image/png`
            - `image/webp`
            - `text/csv`
            - `text/plain`

            Matching ignores case and MIME parameters, so `TEXT/CSV` and
            `text/csv; charset=utf-8` are also accepted.
      required:
        - email
        - filename
        - contentType
      type: object
      additionalProperties: false
    UploadedAuditorFile:
      properties:
        id:
          type: string
      required:
        - id
      type: object
      additionalProperties: false
    FinalizeAuditorFileUploadInput:
      properties:
        uploadId:
          type: string
      required:
        - uploadId
      type: object
      additionalProperties: false
    InformationRequestActivityType:
      type: string
      enum:
        - AUDIT_DUPLICATION_AUDIT_TRAIL
        - AUDIT_INFORMATION_REQUEST_EVIDENCE_FILL
        - CHANGE_STATUS
        - EDIT_REQUEST
        - REMOVE_EVIDENCE
        - SHARE_EVIDENCE_WITH_AUDITOR
        - UPLOAD_EVIDENCE
    EvidenceFillOutcome:
      enum:
        - SUCCESS
        - PARTIAL
        - FAILED
      type: string
    InformationRequestActivityLog:
      description: >-
        Activity log entry tracking changes and actions on an information
        request.


        The activity log provides an audit trail of operations performed on an

        information request, including status changes, evidence uploads, edits,

        and evidence sharing. This enables tracking compliance activities and
        understanding

        the request's history. Which entries are visible depends on the endpoint
        returning

        them; see the endpoint's own description.
      properties:
        id:
          type: string
          description: >-
            The unique identifier for the activity log entry within Vanta's
            system.

            Format: ObjectId as a string (e.g., "6890e473dce1da5d8406f5e7").
        activityType:
          $ref: "#/components/schemas/InformationRequestActivityType"
          description: >-
            Type of activity that occurred on the information request.

            Determines which additional fields are populated.

            `AUDIT_INFORMATION_REQUEST_EVIDENCE_FILL` is never returned —
            automated

            evidence fill activity is withheld — so no entry carries that value
            even

            though the enum still lists it. Do not write a case for it.
        timestamp:
          type: string
          format: date-time
          description: |-
            Timestamp when the activity occurred.
            Format: ISO 8601 UTC timestamp.
        userEmail:
          type: string
          nullable: true
          description: >-
            Email address of the user who performed the activity.

            Null for system-generated activities (rare, such as automated status
            changes).

            This email uniquely identifies users across systems.
        oldStatus:
          type: string
          enum:
            - READY_FOR_AUDIT
            - NEEDS_EVIDENCE
            - AUDITOR_APPROVED
            - AUDITOR_FLAGGED
            - READY_FOR_INTERNAL_REVIEW
            - null
          nullable: true
          description: >-
            Previous approval status before the status change.

            Only populated for status change activities. Null for all other
            activity types.
        newStatus:
          type: string
          enum:
            - READY_FOR_AUDIT
            - NEEDS_EVIDENCE
            - AUDITOR_APPROVED
            - AUDITOR_FLAGGED
            - READY_FOR_INTERNAL_REVIEW
            - null
          nullable: true
          description: >-
            New approval status after the status change.

            Only populated for status change activities. Null for all other
            activity types.
        reason:
          type: string
          nullable: true
          description: >-
            Optional explanation for the status change.

            Only populated for status change activities when a reason is
            provided

            (e.g., when flagging evidence). Null for all other cases.
        fillOutcome:
          allOf:
            - $ref: "#/components/schemas/EvidenceFillOutcome"
          nullable: true
          description: >-
            Result of an automated evidence fill. Always null: only evidence
            fill activities

            could populate it, and those are never returned, so nothing can set
            it. Do not

            branch on it.
          deprecated: true
        sourceInformationRequestId:
          type: string
          nullable: true
          description: >-
            Identifier of the information request this one was copied from when
            its

            audit was duplicated.

            Only populated for audit-duplication trail activities. Null for all
            other activity types.

            Format: ObjectId as a string.
        sourceAuditId:
          type: string
          nullable: true
          description: >-
            Identifier of the audit this request's audit was duplicated from.

            Only populated for audit-duplication trail activities. Null for all
            other activity types.

            Format: ObjectId as a string.
      required:
        - id
        - activityType
        - timestamp
        - userEmail
        - oldStatus
        - newStatus
        - reason
        - fillOutcome
        - sourceInformationRequestId
        - sourceAuditId
      type: object
      additionalProperties: false
