      properties:
        results:
          properties:
            data:
              items:
                $ref: "#/components/schemas/AuditControlComment"
              type: array
            pageInfo:
              $ref: "#/components/schemas/PageInfo"
          required:
            - data
            - pageInfo
          type: object
      required:
        - results
      type: object
      additionalProperties: false
    AddAuditControlCommentInput:
