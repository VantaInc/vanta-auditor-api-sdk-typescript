    ApiDatabaseResourceCategory:
      description: |-
        Allowed values for the `resourceType` query parameter on
        `GET /audits/{auditId}/assets/databases`.

        Each value selects one database kind to paginate. Use
        `GET /audits/{auditId}/assets/databases/types` to discover
        the valid values dynamically.

        Declared as a local enum (not a type alias) so TSOA can
        resolve it for OpenAPI generation, while staying under the
        `no-large-union-type` threshold that only targets type aliases.
      enum:
        - AtlasCluster
        - AzureCosmosDB
        - AzureCosmosDBForPostgreSQL
        - AzureDatabaseForExternalSQLVariant
        - AzureSQLDatabase
        - AzureSQLManagedInstance
        - AzureSQLServerOnVMs
        - AzureSynapseWarehouse
        - BigQueryDataset
        - BigtableInstance
        - CloudSQLInstance
        - DatastoreProject
        - DigitalOceanMongodbCluster
        - DigitalOceanRedisCluster
        - DigitalOceanRelationalDbCluster
        - DynamoDBTable
        - FirestoreProject
        - OracleCloudAutonomousDatabase
        - RDSInstance
        - RedshiftCluster
        - SpannerInstance
      type: string
